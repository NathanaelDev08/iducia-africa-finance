services:
  postgres:
    image: postgres:16-alpine
    container_name: fiducia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fiducia_africa
    ports:
      - "5432:5432"
    volumes:
      - fiducia_pgdata:/var/lib/postgresql/data

volumes:
  fiducia_pgdata:
